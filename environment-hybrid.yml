name: ms2lda-hybrid
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Pinned embedding-path runtime; install DreaMS as documented in the method.
      - numpy==1.25.0
      - scipy==1.13.1
      - numba==0.58.0
      # DreaMS metadata pins 2.2.1, but the embedding path is validated with
      # patched Torch 2.6.0 and installs DreaMS separately with --no-deps.
      - torch==2.6.0
      - pytorch-lightning==2.0.8
      - torchmetrics==1.3.2
      - pandas==2.2.1
      - rdkit==2023.9.6
      - h5py==3.11.0
      - umap-learn==0.5.6
      - scikit-learn==1.5.2
      - seaborn==0.13.2
      - plotly==5.20.0
      - ase==3.22.1
      - wandb==0.16.4
      - pandarallel==1.6.5
      - matchms==0.27.0
      - "pyopenms==3.3.0; sys_platform == 'darwin'"
      - "pyopenms==3.4.0; sys_platform != 'darwin'"
      - igraph==0.11.4
      - huggingface-hub==0.33.5
      - setuptools==81.0.0
      - pytest==8.3.5
      - git+https://github.com/roman-bushuiev/msml_legacy_architectures.git@d35b34b0caee38348098cda852bff30d8b25cd25
