name: ETM ECRTM MSnLib research

# Research-only workflow. Intentionally manual: pushing to the handoff branch
# must never start the expensive MSnLib campaign automatically.
on:
  workflow_dispatch:
    inputs:
      etm_epochs:
        description: Fixed-SGNS ETM epochs
        required: true
        default: "120"
      ecrtm_epochs:
        description: TopMost-style ECRTM epochs
        required: true
        default: "40"

permissions:
  contents: read

jobs:
  validation-only:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATA_ROOT: /tmp/msnlib-assets
      RUN_DIR: /tmp/published-models-run
      OMP_NUM_THREADS: "6"
      MKL_NUM_THREADS: "6"
      OPENBLAS_NUM_THREADS: "6"
      NUMEXPR_NUM_THREADS: "6"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.25.2 scipy==1.13.1 torch==2.6.0 rdkit==2024.9.6
          python -m pip install --no-deps -e .

      - name: Download only the benchmark MGF from the frozen Zenodo Data archive
        run: |
          set -euxo pipefail
          mkdir -p "$DATA_ROOT/extracted/Data/Benchmark_MSn_Lib"
          curl -fL --retry 5 --retry-delay 5 \
            "https://zenodo.org/records/20179680/files/Data.zip?download=1" \
            -o "/tmp/Data.zip"
          unzip -Z1 "/tmp/Data.zip" | grep -F "Corinna_Library_filtered_positive.mgf"
          unzip -p "/tmp/Data.zip" \
            "Data/Benchmark_MSn_Lib/Corinna_Library_filtered_positive.mgf" \
            > "$DATA_ROOT/extracted/Data/Benchmark_MSn_Lib/Corinna_Library_filtered_positive.mgf"
          test "$(stat -c %s "$DATA_ROOT/extracted/Data/Benchmark_MSn_Lib/Corinna_Library_filtered_positive.mgf")" -eq 88159030
          rm -f "/tmp/Data.zip"
          df -h

      - name: Reproduce locked split, vocabulary, and train-only SGNS
        run: |
          python scripts/run_published_topic_models_msnlib.py prepare \
            --run "$RUN_DIR" --data-root "$DATA_ROOT"

      - name: Run validation-only fixed-SGNS ETM and ECRTM feasibility/comparison
        run: |
          python scripts/run_published_topic_models_msnlib.py compare \
            --run "$RUN_DIR" \
            --etm-epochs "${{ inputs.etm_epochs }}" \
            --ecrtm-epochs "${{ inputs.ecrtm_epochs }}"

      - name: Print compact result
        if: always()
        run: |
          if [ -f "$RUN_DIR/published_models/summary.json" ]; then
            cat "$RUN_DIR/published_models/summary.json"
          fi
          find "$RUN_DIR/published_models" -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null || true

      - name: Upload validation research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etm-ecrtm-msnlib-validation
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
          path: |
            /tmp/published-models-run/published_models
            /tmp/published-models-run/validation_evaluation
            /tmp/published-models-run/protocol.json
            /tmp/published-models-run/data/complete.json
            /tmp/published-models-run/data/vocabulary.json
            /tmp/published-models-run/token_features/complete.json
