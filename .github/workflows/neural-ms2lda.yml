name: Contextual Sparse ETM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  focused-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused research dependencies
        run: >-
          python -m pip install
          numpy==1.25.2 scipy==1.13.1 torch==2.6.0
          rdkit==2024.9.6 entmax==1.3
          pytest==8.3.5 black==24.10.0
          ruff==0.11.13
      - name: Install project without production dependency resolution
        run: python -m pip install --no-deps -e .
      - name: Black
        run: |
          black --check benchmarks/neural_ms2lda \
            scripts/download_msnlib_validation_assets.py \
            scripts/evaluate_frozen_etm_test.py \
            scripts/evaluate_frozen_tomotopy_test.py \
            scripts/generate_contextual_sparse_etm_report.py \
            scripts/package_contextual_sparse_etm_reproduction.py \
            scripts/prepare_contextual_sparse_etm_data.py \
            scripts/prepare_contextual_sparse_etm_synthetic.py \
            scripts/prepare_msnlib_test_view.py \
            scripts/prepare_msnlib_validation_view.py \
            scripts/run_contextual_sparse_etm.py \
            scripts/run_contextual_sparse_etm_reproduction.py \
            scripts/run_contextual_sparse_etm_synthetic.py \
            scripts/run_etm_controls.py \
            scripts/run_tomotopy_validation.py
      - name: Ruff
        run: |
          ruff check --config benchmarks/neural_ms2lda/ruff.toml \
            benchmarks/neural_ms2lda \
            scripts/download_msnlib_validation_assets.py \
            scripts/evaluate_frozen_etm_test.py \
            scripts/evaluate_frozen_tomotopy_test.py \
            scripts/generate_contextual_sparse_etm_report.py \
            scripts/package_contextual_sparse_etm_reproduction.py \
            scripts/prepare_contextual_sparse_etm_data.py \
            scripts/prepare_contextual_sparse_etm_synthetic.py \
            scripts/prepare_msnlib_test_view.py \
            scripts/prepare_msnlib_validation_view.py \
            scripts/run_contextual_sparse_etm.py \
            scripts/run_contextual_sparse_etm_reproduction.py \
            scripts/run_contextual_sparse_etm_synthetic.py \
            scripts/run_etm_controls.py \
            scripts/run_tomotopy_validation.py
      - name: Scientific tests
        run: pytest -q benchmarks/neural_ms2lda/tests

  upstream-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install production project and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest==8.3.5 build==1.2.2.post1
          # Upstream metadata currently resolves spec2vec 0.8.1 with matchms
          # 0.33.1, although that Spec2Vec release imports removed MatchMS APIs.
          # Tomotopy 0.14 also aborts on the upstream zero-topic regression.
          # Use the validated dependency pins for regression coverage.
          python -m pip install matchms==0.29.0 spec2vec==0.9.1 tomotopy==0.13.0
      - name: Upstream regression tests
        run: NUMBA_DISABLE_JIT=1 pytest -q tests
      - name: Build and isolated wheel import
        run: |
          python -m build --wheel
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert "scripts/ms2lda_runfull.py" in names
          forbidden = {
              name
              for name in names
              if name.startswith("scripts/")
              and name not in {"scripts/__init__.py", "scripts/ms2lda_runfull.py"}
          }
          assert not forbidden, sorted(forbidden)
          PY
          python -m pip install --no-deps --force-reinstall dist/*.whl
          cd /tmp
          python -c "import MS2LDA; print(MS2LDA.__file__)"

  report:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1786906800"
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate report inputs
        run: |
          python -S -m scripts.generate_contextual_sparse_etm_report
          report_drift="$(git status --porcelain --untracked-files=all -- docs/research/generated)"
          if [ -n "$report_drift" ]; then
            echo "$report_drift"
            exit 1
          fi
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: contextual_sparse_etm_report.tex
          working_directory: docs/research
