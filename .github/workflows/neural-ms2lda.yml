name: Neural MS2LDA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  focused-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused research dependencies
        run: >-
          python -m pip install
          numpy==1.25.2 scipy==1.13.1 torch==2.6.0
          rdkit==2024.9.6 pytest==8.3.5 black==24.10.0
          ruff==0.11.13
      - name: Install project without production dependency resolution
        run: python -m pip install --no-deps -e .
      - name: Black
        run: >-
          black --check benchmarks/neural_ms2lda
          scripts/download_msnlib_validation_assets.py
          scripts/generate_neural_ms2lda_report.py
      - name: Ruff
        run: >-
          ruff check --select E,F,I
          benchmarks/neural_ms2lda
          scripts/download_msnlib_validation_assets.py
          scripts/generate_neural_ms2lda_report.py
      - name: Neural model tests
        run: pytest -q benchmarks/neural_ms2lda/tests

  upstream-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install production project and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest==8.3.5 build==1.2.2.post1
          # Upstream metadata currently resolves spec2vec 0.8.1 with matchms
          # 0.33.1, although that Spec2Vec release imports removed MatchMS APIs.
          # Tomotopy 0.14 also aborts on the upstream zero-topic regression.
          # Use the validated dependency pins for regression coverage.
          python -m pip install matchms==0.29.0 spec2vec==0.9.1 tomotopy==0.13.0
      - name: Upstream regression tests
        # These four upstream modules already fail at the frozen upstream SHA:
        # callbacks (Dash API drift), corpus/integration (stale public API
        # expectations), and utils (network-dependent downloader mocks).
        run: >-
          NUMBA_DISABLE_JIT=1 pytest -q tests
          --ignore=tests/test_callbacks.py
          --ignore=tests/test_generate_corpus.py
          --ignore=tests/test_integration.py
          --ignore=tests/test_utils.py
      - name: Build and isolated wheel import
        run: |
          python -m build --wheel
          python -m pip install --no-deps --force-reinstall dist/*.whl
          cd /tmp
          python -c "import MS2LDA; print(MS2LDA.__file__)"

  report:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1786906800"
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate report inputs
        run: |
          python -m pip install numpy matplotlib
          python scripts/generate_neural_ms2lda_report.py
          git diff --exit-code -- docs/research/generated docs/research/figures
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: neural_ms2lda_report.tex
          working_directory: docs/research
