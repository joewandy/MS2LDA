name: Hybrid LDA reference

on:
  pull_request:
    paths:
      - ".github/workflows/hybrid-reference.yml"
      - "benchmarks/**"
      - "docs/hybrid_lda_method.tex"
      - "environment-hybrid.yml"
      - "environment-msnlib-mag.yml"
      - "ms2lda_hybrid/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "scripts/download_msnlib_validation_assets.py"
      - "tests/test_hybrid_lda.py"
      - "tests/test_msnlib_*.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hybrid-reference.yml"
      - "benchmarks/**"
      - "docs/hybrid_lda_method.tex"
      - "environment-hybrid.yml"
      - "environment-msnlib-mag.yml"
      - "ms2lda_hybrid/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "scripts/download_msnlib_validation_assets.py"
      - "tests/test_hybrid_lda.py"
      - "tests/test_msnlib_*.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: |
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.6.0
          python -m pip install \
            black==24.10.0 build==1.2.2.post1 h5py==3.11.0 \
            numpy==1.25.0 pytest==8.3.5 \
            ruff==0.11.13 scipy==1.13.1
      - name: Check formatting
        run: >-
          python -m black --check
          ms2lda_hybrid benchmarks
          scripts/download_msnlib_validation_assets.py
          tests/test_hybrid_lda.py tests/test_msnlib_*.py
      - name: Check imports and runtime errors
        run: >-
          python -m ruff check --select E4,E7,E9,F,I
          ms2lda_hybrid benchmarks
          scripts/download_msnlib_validation_assets.py
          tests/test_hybrid_lda.py tests/test_msnlib_*.py
      - name: Run focused tests
        run: >-
          python -m pytest --noconftest -q
          tests/test_hybrid_lda.py tests/test_msnlib_*.py
      - name: Verify the built wheel contains the Hybrid LDA package
        run: |
          python -m build --wheel
          python -m pip install --force-reinstall --no-deps dist/ms2lda-*.whl
          cd /tmp
          python -c "import ms2lda_hybrid; print(ms2lda_hybrid.__file__)"
